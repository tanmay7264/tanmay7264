<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Career-Ops Web: An AI-powered job-search pipeline, in the browser. Built a SaaS front end for the Claude Code career-ops system: match, tailor, track. Stack: TypeScript, Next.js, Claude, Vercel.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#070B16"/></linearGradient>
  <radialGradient id="glow" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#B8661F" stop-opacity=".45"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F2A541" stroke-opacity=".06"/></pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2A541"/><stop offset=".6" stop-color="#B8661F"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#F2A541"/><stop offset=".5" stop-color="#F5F1E8"/><stop offset="1" stop-color="#F2A541"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
</defs><style>
  .serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
  .in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both} .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.55s} .d4{animation-delay:.75s} .d5{animation-delay:.95s} .d6{animation-delay:1.15s}
  .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards}
  .spin{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite} .spin-r{animation-direction:reverse;animation-duration:60s}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bob{animation:bob 5s ease-in-out infinite alternate} .bob2{animation-duration:3.6s;animation-delay:-1.2s} .bob3{animation-duration:4.4s;animation-delay:-2.5s}
  .win{animation:win 4s ease-in-out infinite alternate} .wave{animation:wave 3s ease-in-out infinite alternate}
  .flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.6s ease-in-out infinite alternate}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{to{transform:translateY(-10px)}}
  @keyframes win{0%,40%{opacity:.25}100%{opacity:1}}
  @keyframes wave{from{opacity:.15}to{opacity:.6}}
  @keyframes flag{to{transform:skewY(6deg) scaleX(.92)}}
  @media (prefers-reduced-motion:reduce){.in,.spin,.bob,.win,.wave,.flag{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="340" fill="url(#bg)"/><rect x="720" width="480" height="340" fill="url(#grid)"/><rect width="1200" height="340" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#1E2A44"/>

<g class="in d1"><text class="mono" x="56" y="62" font-size="12" fill="#F2A541" letter-spacing="2.6">04 · AI · CAREER TECH · 2026</text>
<text class="serif" x="54" y="124" font-size="52" fill="#F5F1E8" letter-spacing="-1.5" font-weight="300">Career-Ops Web</text>
<text class="sans" x="56" y="162" font-size="17" fill="#9AA6B8">An AI-powered job-search pipeline, in the browser.</text>
<text class="mono" x="56" y="196" font-size="12.5" fill="#FFD9A8"><tspan fill="#F2A541">BUILT ›</tspan> a SaaS front end for the Claude Code career-ops system: match, tailor, track</text></g>
<path class="draw" d="M56 228 H700" stroke="url(#rule)"/>
<g class="in d3"><rect x="56" y="260" width="100" height="28" rx="14" fill="#B8661F" fill-opacity=".45"/><rect x="56" y="256" width="100" height="28" rx="14" fill="#0B1120"/><rect x="56" y="256" width="100" height="28" rx="14" fill="#F2A541" fill-opacity=".08" stroke="#F2A541" stroke-opacity=".35"/><text class="mono" x="106" y="274.5" font-size="12" fill="#FFD9A8" text-anchor="middle">TypeScript</text>
<rect x="166" y="260" width="77.80000000000001" height="28" rx="14" fill="#B8661F" fill-opacity=".45"/><rect x="166" y="256" width="77.80000000000001" height="28" rx="14" fill="#0B1120"/><rect x="166" y="256" width="77.80000000000001" height="28" rx="14" fill="#F2A541" fill-opacity=".08" stroke="#F2A541" stroke-opacity=".35"/><text class="mono" x="204.9" y="274.5" font-size="12" fill="#FFD9A8" text-anchor="middle">Next.js</text>
<rect x="253.8" y="260" width="70.4" height="28" rx="14" fill="#B8661F" fill-opacity=".45"/><rect x="253.8" y="256" width="70.4" height="28" rx="14" fill="#0B1120"/><rect x="253.8" y="256" width="70.4" height="28" rx="14" fill="#F2A541" fill-opacity=".08" stroke="#F2A541" stroke-opacity=".35"/><text class="mono" x="289" y="274.5" font-size="12" fill="#FFD9A8" text-anchor="middle">Claude</text>
<rect x="334.20000000000005" y="260" width="70.4" height="28" rx="14" fill="#B8661F" fill-opacity=".45"/><rect x="334.20000000000005" y="256" width="70.4" height="28" rx="14" fill="#0B1120"/><rect x="334.20000000000005" y="256" width="70.4" height="28" rx="14" fill="#F2A541" fill-opacity=".08" stroke="#F2A541" stroke-opacity=".35"/><text class="mono" x="369.40000000000003" y="274.5" font-size="12" fill="#FFD9A8" text-anchor="middle">Vercel</text></g>
<g class="in d2"><polygon points="770.0,50.0 780.0,40.0 1144.0,40.0 1134.0,50.0" fill="#F2A541" fill-opacity=".22"/><polygon points="1134.0,50.0 1144.0,40.0 1144.0,110.0 1134.0,120.0" fill="#B8661F" fill-opacity=".4"/><rect x="770" y="50" width="364" height="70" fill="#070B16" fill-opacity=".92" stroke="#1E2A44"/>
<text class="serif" x="794" y="96" font-size="30" fill="#F5F1E8" font-weight="300">SaaS</text><text class="mono" x="1112" y="92" font-size="12" fill="#9AA6B8" text-anchor="end" letter-spacing="1">web app</text></g>
<g class="in d3"><polygon points="770.0,136.0 780.0,126.0 1144.0,126.0 1134.0,136.0" fill="#F2A541" fill-opacity=".22"/><polygon points="1134.0,136.0 1144.0,126.0 1144.0,196.0 1134.0,206.0" fill="#B8661F" fill-opacity=".4"/><rect x="770" y="136" width="364" height="70" fill="#070B16" fill-opacity=".92" stroke="#1E2A44"/>
<text class="serif" x="794" y="182" font-size="30" fill="#F5F1E8" font-weight="300">AI</text><text class="mono" x="1112" y="178" font-size="12" fill="#9AA6B8" text-anchor="end" letter-spacing="1">JD matching</text></g>
<g class="in d4"><polygon points="770.0,222.0 780.0,212.0 1144.0,212.0 1134.0,222.0" fill="#F2A541" fill-opacity=".22"/><polygon points="1134.0,222.0 1144.0,212.0 1144.0,282.0 1134.0,292.0" fill="#B8661F" fill-opacity=".4"/><rect x="770" y="222" width="364" height="70" fill="#070B16" fill-opacity=".92" stroke="#1E2A44"/>
<text class="serif" x="794" y="268" font-size="30" fill="#F5F1E8" font-weight="300">Live</text><text class="mono" x="1112" y="264" font-size="12" fill="#9AA6B8" text-anchor="end" letter-spacing="1">on Vercel</text></g>
</g></svg>
