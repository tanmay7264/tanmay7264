<text class="sans" x="874" y="400" font-size="13" fill="#9AA6B8"><tspan class="serif" font-size="30" fill="#F5F1E8">45→80%</tspan><tspan dx="10" fill="#9AA6B8">villa occupancy</tspan></text></g>
