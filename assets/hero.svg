<polygon points="975.0,72.0 1082.4,134.0 975.0,196.0 867.6,134.0" fill="#F2A541" stroke="#FFD9A8" stroke-opacity=".55" stroke-linejoin="round"/>
<polygon points="867.6,258.0 975.0,320.0 975.0,196.0 867.6,134.0" fill="#B8661F" stroke="#FFD9A8" stroke-opacity=".55" stroke-linejoin="round"/>
<polygon points="1082.4,258.0 975.0,320.0 975.0,196.0 1082.4,134.0" fill="#653811" stroke="#FFD9A8" stroke-opacity=".55" stroke-linejoin="round"/>
<text class="serif" transform="matrix(0.866 0.5 -0.866 0.5 975.0 134.0)" y="20" font-size="60" font-style="italic" text-anchor="middle" fill="#070B16">TN</text>
<text class="mono" transform="matrix(0.866 0.5 0 1 921.3 227.0)" y="5" font-size="13" letter-spacing="3" text-anchor="middle" fill="#F5F1E8">PRODUCT</text>
<text class="mono" transform="matrix(0.866 -0.5 0 1 1028.7 227.0)" y="5" font-size="13" letter-spacing="3" text-anchor="middle" fill="#FFD9A8">GROWTH</text>
</g>
<circle r="5" fill="#F2A541"><animateMotion dur="9s" repeatCount="indefinite" path="M775 196 a200 64 0 1 0 400 0 a200 64 0 1 0 -400 0"/></circle>
<g class="in d1"><text class="mono" x="64" y="78" font-size="12" fill="#F2A541" letter-spacing="3">HELLO, WORLD · MUMBAI, IN</text></g>
