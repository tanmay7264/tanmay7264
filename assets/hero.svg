<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Tanmay Narnaware: Product &amp; Growth Builder. I connect engineering, customer insight and growth to build products people return to.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#070B16"/></linearGradient>
  <radialGradient id="glow" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#B8661F" stop-opacity=".45"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F2A541" stroke-opacity=".06"/></pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2A541"/><stop offset=".6" stop-color="#B8661F"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#F2A541"/><stop offset=".5" stop-color="#F5F1E8"/><stop offset="1" stop-color="#F2A541"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="440" rx="18"/></clipPath>
</defs><style>
  .serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
  .in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both} .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.55s} .d4{animation-delay:.75s} .d5{animation-delay:.95s} .d6{animation-delay:1.15s}
  .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards}
  .spin{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite} .spin-r{animation-direction:reverse;animation-duration:60s}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bob{animation:bob 5s ease-in-out infinite alternate} .bob2{animation-duration:3.6s;animation-delay:-1.2s} .bob3{animation-duration:4.4s;animation-delay:-2.5s}
  .win{animation:win 4s ease-in-out infinite alternate} .wave{animation:wave 3s ease-in-out infinite alternate}
  .flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.6s ease-in-out infinite alternate}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{to{transform:translateY(-10px)}}
  @keyframes win{0%,40%{opacity:.25}100%{opacity:1}}
  @keyframes wave{from{opacity:.15}to{opacity:.6}}
  @keyframes flag{to{transform:skewY(6deg) scaleX(.92)}}
  @media (prefers-reduced-motion:reduce){.in,.spin,.bob,.win,.wave,.flag{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="440" fill="url(#bg)"/><rect x="720" width="480" height="440" fill="url(#grid)"/><rect width="1200" height="440" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="439" rx="18" fill="none" stroke="#1E2A44"/>

<ellipse cx="975" cy="342" rx="100" ry="11" fill="#000" fill-opacity=".4"/>
