<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Experience: 2026, University of Bamberg, Product Management &amp; Strategy Intern, Alumni portal MVP, mentor matching, 4-phase launch plan; 2021–24, Apexon, Associate SE → Senior Front End Developer, 30% faster load speed, 20% higher engagement; Venture, Lonavala Villas, Founder, Hospitality Growth, Occupancy 45% → 80% via seasonal pricing; Venture, The Socials Web, Co-Founder, Digital Growth, +40% organic traffic, 3× leads, +20% conversion">
<defs>
