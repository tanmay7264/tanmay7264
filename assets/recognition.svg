<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Recognition: 99.37 CMAT percentile Innovation &amp; Entrepreneurship, top 1%; Award Outstanding Internship University of Bamberg, Germany; 1,400+ Learning community WeSchool students across AI &amp; tech; Winner InnoMUN 2025 BITS Pilani Marketing Parliament; 2nd RU We4Tech hackathon Among 90 teams, rail-pass prototype; Lead Google Student Developer Junior Community Lead, West Zone">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#070B16"/></linearGradient>
  <radialGradient id="glow" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#B8661F" stop-opacity=".45"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F2A541" stroke-opacity=".06"/></pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2A541"/><stop offset=".6" stop-color="#B8661F"/><stop offset="1" stop-color="#B8661F" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#F2A541"/><stop offset=".5" stop-color="#F5F1E8"/><stop offset="1" stop-color="#F2A541"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
</defs><style>
  .serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
  .in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both} .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.55s} .d4{animation-delay:.75s} .d5{animation-delay:.95s} .d6{animation-delay:1.15s}
  .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards}
  .spin{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite} .spin-r{animation-direction:reverse;animation-duration:60s}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.in,.spin{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="340" fill="url(#bg)"/><rect x="720" width="480" height="340" fill="url(#grid)"/><rect width="1200" height="340" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#1E2A44"/>
<g class="in d1"><rect x="40" y="36" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="64" y="88" font-size="34" fill="url(#sheen)" font-weight="300">99.37</text>
<text class="sans" x="64" y="116" font-size="15.5" fill="#F5F1E8" font-weight="600">CMAT percentile</text><text class="sans" x="64" y="138" font-size="13" fill="#9AA6B8">Innovation &amp; Entrepreneurship, top 1%</text></g>
<g class="in d2"><rect x="416" y="36" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="440" y="88" font-size="34" fill="url(#sheen)" font-weight="300">Award</text>
<text class="sans" x="440" y="116" font-size="15.5" fill="#F5F1E8" font-weight="600">Outstanding Internship</text><text class="sans" x="440" y="138" font-size="13" fill="#9AA6B8">University of Bamberg, Germany</text></g>
<g class="in d3"><rect x="792" y="36" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="816" y="88" font-size="34" fill="url(#sheen)" font-weight="300">1,400+</text>
<text class="sans" x="816" y="116" font-size="15.5" fill="#F5F1E8" font-weight="600">Learning community</text><text class="sans" x="816" y="138" font-size="13" fill="#9AA6B8">WeSchool students across AI &amp; tech</text></g>
<g class="in d4"><rect x="40" y="176" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="64" y="228" font-size="34" fill="url(#sheen)" font-weight="300">Winner</text>
<text class="sans" x="64" y="256" font-size="15.5" fill="#F5F1E8" font-weight="600">InnoMUN 2025</text><text class="sans" x="64" y="278" font-size="13" fill="#9AA6B8">BITS Pilani Marketing Parliament</text></g>
<g class="in d5"><rect x="416" y="176" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="440" y="228" font-size="34" fill="url(#sheen)" font-weight="300">2nd RU</text>
<text class="sans" x="440" y="256" font-size="15.5" fill="#F5F1E8" font-weight="600">We4Tech hackathon</text><text class="sans" x="440" y="278" font-size="13" fill="#9AA6B8">Among 90 teams, rail-pass prototype</text></g>
<g class="in d6"><rect x="792" y="176" width="356" height="122" rx="14" fill="#070B16" fill-opacity=".6" stroke="#1E2A44"/>
<text class="serif" x="816" y="228" font-size="34" fill="url(#sheen)" font-weight="300">Lead</text>
<text class="sans" x="816" y="256" font-size="15.5" fill="#F5F1E8" font-weight="600">Google Student Developer</text><text class="sans" x="816" y="278" font-size="13" fill="#9AA6B8">Junior Community Lead, West Zone</text></g>
</g></svg>
